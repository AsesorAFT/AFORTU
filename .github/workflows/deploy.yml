name: CI AFORTU

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build Application
        run: npm run build:ci
        env:
          NODE_ENV: production

      - name: 🧪 Run Tests (if available)
        run: npm test --if-present

  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Lint Code
        run: npm run lint --if-present

      - name: 💅 Check Prettier Formatting
        run: npx prettier --check . --ignore-path .gitignore || echo "Prettier check completed"

  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: 🔒 Security Audit
        run: npm audit --omit=dev --audit-level high
